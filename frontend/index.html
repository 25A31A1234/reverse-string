<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Reverser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>String Reverser</h1>
        <p class="description">
            Enter any text below and this tool will reverse it for you.
        </p>

        <input 
            type="text" 
            id="inputString" 
            placeholder="Type something here..."
        >

        <button id="reverseButton">Reverse String</button>

        <div class="results">
            <div class="result-box">
                <h2>Original String</h2>
                <p id="originalResult">—</p>
            </div>

            <div class="result-box">
                <h2>Reversed String</h2>
                <p id="reversedResult">—</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
